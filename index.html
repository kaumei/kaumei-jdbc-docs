<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coming soon | Kaumei JDBC</title>
    <meta name="description" content="Coming soon: Documentation for Kaumei JDBC." />
    <link rel="canonical" href="https://kaumei-jdbc.kaumei.io/" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --text: #e7e9ee;
        --muted: #a4abb9;
        --link: #7aa2ff;
        --card: #161a22;
        --border: #242a36;
        --radius: 12px;
        --font: "Space Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }

      main {
        max-width: 720px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 32px 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.9rem;
      }

      p {
        margin: 0 0 16px;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--muted);
      }

      a {
        color: var(--link);
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 18px;
        margin-top: 8px;
      }

      .footnote {
        margin-top: 20px;
        font-size: 0.9rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Coming soon</h1>
      <p>
        The Kaumei JDBC documentation is being prepared. For now, you can view the preview here:
        <a href="https://kaumei.codeberg.page/kaumei-jdbc/" rel="noopener"
          >Preview docs</a
        >.
      </p>
      <div class="links">
        <a href="https://kaumei.codeberg.org/kaumei-jdbc" rel="noopener">Repository</a>
      </div>
      <p class="footnote">Updated: 2026-01-17</p>
    </main>
  </body>
</html>
